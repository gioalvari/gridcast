<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630" role="img" aria-labelledby="title description">
  <title id="title">PJME historical holdout mean absolute error</title>
  <desc id="description">Horizontal bar chart comparing TimesFM zero-shot, LightGBM, and seasonal baselines. Lower mean absolute error is better.</desc>
  <rect width="1120" height="630" fill="#f4f1ea"/>
  <text x="64" y="58" fill="#17242b" font-family="Arial, sans-serif" font-size="30" font-weight="700">PJME historical holdout comparison</text>
  <text x="64" y="88" fill="#69767c" font-family="Arial, sans-serif" font-size="16">Mean absolute error in MW · lower is better · 52 weekly folds</text>
  <line x1="388" y1="126" x2="388" y2="548" stroke="#17242b" stroke-width="2"/>
  <g fill="#69767c" font-family="Arial, sans-serif" font-size="13">
    <text x="388" y="575" text-anchor="middle">0</text>
    <text x="572" y="575" text-anchor="middle">1,000</text>
    <text x="756" y="575" text-anchor="middle">2,000</text>
    <text x="940" y="575" text-anchor="middle">3,000 MW</text>
  </g>
  <g stroke="#17242b" stroke-opacity="0.10">
    <line x1="572" y1="126" x2="572" y2="548"/>
    <line x1="756" y1="126" x2="756" y2="548"/>
    <line x1="940" y1="126" x2="940" y2="548"/>
  </g>
  <g fill="#17242b" font-family="Arial, sans-serif" font-size="17">
    <text x="368" y="159" text-anchor="end">TimesFM 2.5 200M zero-shot*</text>
    <text x="368" y="229" text-anchor="end">LightGBM + weather + holidays</text>
    <text x="368" y="299" text-anchor="end">LightGBM + weather</text>
    <text x="368" y="369" text-anchor="end">LightGBM base</text>
    <text x="368" y="439" text-anchor="end">Daily seasonal naive</text>
    <text x="368" y="509" text-anchor="end">Weekly seasonal naive</text>
  </g>
  <rect x="388" y="135" width="355" height="36" rx="3" fill="#17242b"/>
  <rect x="388" y="205" width="534" height="36" rx="3" fill="#f05d23"/>
  <rect x="388" y="275" width="536" height="36" rx="3" fill="#e68a3c"/>
  <rect x="388" y="345" width="547" height="36" rx="3" fill="#42b7c8"/>
  <rect x="388" y="415" width="551" height="36" rx="3" fill="#5969a6"/>
  <rect x="388" y="485" width="660" height="36" rx="3" fill="#9a6fb0"/>
  <g fill="#17242b" font-family="Arial, sans-serif" font-size="15" font-weight="700">
    <text x="753" y="159">1,927</text>
    <text x="932" y="229">2,902</text>
    <text x="934" y="299">2,913</text>
    <text x="945" y="369">2,972</text>
    <text x="949" y="439">2,994</text>
    <text x="1058" y="509">3,585</text>
  </g>
  <text x="64" y="608" fill="#69767c" font-family="Arial, sans-serif" font-size="13">* Optional Apache-2.0 checkpoint; overlap with broad pretraining data cannot be ruled out.</text>
</svg>
