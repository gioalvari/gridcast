[project]
name = "gridcast"
version = "0.1.0"
description = "Reproducible probabilistic energy forecasting and backtesting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gioalvari", email = "giordano.alvari.work@gmail.com" }]
dependencies = [
    "fastapi>=0.116",
    "lightgbm>=4.6",
    "matplotlib>=3.9",
    "numpy>=2.0,<2.5",
    "pandas>=2.2",
    "plotly>=6.0",
    "psutil>=7.0",
    "pyarrow>=17.0",
    "scikit-learn>=1.6",
    "streamlit>=1.47",
    "uvicorn>=0.35",
]

[project.urls]
Repository = "https://github.com/gioalvari/gridcast"
Documentation = "https://github.com/gioalvari/gridcast#readme"

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "mypy>=1.15",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-psutil>=7.0",
]

[project.scripts]
gridcast = "gridcast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=gridcast --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["gridcast"]
omit = ["src/gridcast/dashboard.py"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["gridcast"]
mypy_path = "src"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "D", "E", "F", "I", "UP", "W"]
ignore = ["D100", "D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"src/gridcast/dashboard.py" = ["C408", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
